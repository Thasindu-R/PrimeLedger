# The Testcontainers suite. The datasource is supplied by @ServiceConnection
# from the container, so nothing here points at a real database.
spring:
  jpa:
    hibernate:
      # The whole point of running against real PostgreSQL: if an entity drifts
      # from the migration, the context fails to start and the suite goes red.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

primeledger:
  cors:
    allowed-origins: http://localhost:5173
  api:
    base-url: http://localhost:8080
  dev:
    user-id: 00000000-0000-4000-8000-000000000001
  seed-demo-data: false
  fx:
    # Deliberately not a real host. The scheduled fetch is switched off in
    # AbstractIntegrationTest, and a suite that reached a third-party service
    # would be one that goes red when somebody else's server does — so if
    # anything here ever does make a call, it should fail immediately and
    # obviously rather than quietly succeed on a machine with a network.
    #
    # Tests that need rates insert the exact ones they are reasoning about;
    # see FxConversionIntegrationTest.
    api-url: http://fx.invalid
    base: EUR
    job:
      enabled: false

logging:
  level:
    root: WARN
    com.primeledger: INFO
    org.testcontainers: INFO
