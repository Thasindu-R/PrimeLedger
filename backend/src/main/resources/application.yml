spring:
  application:
    name: primeledger-api

  # Two roles, deliberately. Row-level security is bypassed outright by a
  # superuser and by the table owner unless FORCE is set, so the role that runs
  # migrations cannot also be the role that serves requests — sharing one would
  # make every policy in V2 inert while everything appeared to work. Flyway keeps
  # the privileged role; the connection pool gets the unprivileged one that V2
  # creates. RlsGuard checks this at start-up rather than trusting it.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/primeledger}
    username: ${APP_DATABASE_USER:primeledger_app}
    password: ${APP_DATABASE_PASSWORD:primeledger_app_dev}
    hikari:
      pool-name: primeledger-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema in every environment. Hibernate never mutates it
      # (proposal §5.1) — it only checks that the mapping still matches, which
      # turns a drifted entity into a start-up failure instead of a runtime one.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    # No url: Flyway reuses the application DataSource's URL and only swaps the
    # credentials. Pinning a url here would send migrations to localhost even
    # when the DataSource points somewhere else — which is exactly what happens
    # under Testcontainers.
    user: ${DATABASE_USER:primeledger}
    password: ${DATABASE_PASSWORD:primeledger}
    # No placeholders: the runtime role's password is provisioned per environment
    # (docker/postgres-init locally, by hand on Supabase) rather than baked into
    # a migration that runs everywhere.

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/readiness and /liveness (FR-40).
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Supabase Auth. The API validates RS256 tokens against the published JWKS and
# never holds a secret of its own (proposal §9.2).
supabase:
  url: ${SUPABASE_URL:}
  jwks-uri: ${SUPABASE_JWKS_URI:}
  issuer: ${SUPABASE_ISSUER:}
  audience: ${SUPABASE_AUDIENCE:authenticated}

primeledger:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  api:
    base-url: ${API_BASE_URL:http://localhost:8080}
  security:
    # Refuse to start if the runtime role can bypass row-level security. Turning
    # this off does not disable RLS — it disables noticing that RLS is off.
    require-rls: ${REQUIRE_RLS:true}
  dev:
    # When true, authentication is skipped entirely and every request is
    # attributed to user-id below. Local development without a Supabase project
    # only; SecurityConfig refuses to start with it under the prod profile.
    fixed-user: ${FIXED_USER:false}
    user-id: 00000000-0000-4000-8000-000000000001

  # Exchange rates (F-05). Frankfurter publishes the European Central Bank's
  # reference rates: no key, no quota, and a number the user could look up
  # themselves, which is the property that matters for a figure a finance app
  # presents as fact.
  fx:
    # api.frankfurter.app now 301s to this host and path; the old one is what
    # the proposal names and what .env.example shipped with, and a redirect is
    # not something a JSON client should be following silently.
    #
    # Coverage is the thing to know before choosing a provider here: Frankfurter
    # republishes the ECB's reference rates, which cover about thirty
    # currencies. LKR is not among them. An account held in a currency the
    # provider does not quote still works — amounts are stored natively and are
    # never converted on the way in — but it cannot be included in a converted
    # total, and the summary reports how many rows that affected rather than
    # quietly dropping them. exchangerate.host covers more and wants an API key.
    api-url: ${FX_API_URL:https://api.frankfurter.dev/v1}
    # The currency every stored rate is quoted against, and the provider's own
    # base. Not a preference: fx_convert divides one quote by another and is
    # only correct while both are against the same thing, so changing this
    # without clearing fx_rates would corrupt every conversion, historical ones
    # included. FxRateService refuses to store a set with a different base.
    base: ${FX_BASE:EUR}
    job:
      enabled: ${FX_JOB_ENABLED:true}
      cron: ${FX_JOB_CRON:0 0 3 * * *}

  recurring:
    sweep:
      enabled: ${RECURRING_SWEEP_ENABLED:true}
      cron: ${RECURRING_SWEEP_CRON:0 30 1 * * *}

logging:
  level:
    com.primeledger: INFO

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.primeledger: DEBUG
    org.hibernate.SQL: DEBUG

primeledger:
  seed-demo-data: true
  dev:
    # Local runs work without a Supabase project by default. Set FIXED_USER=false
    # once SUPABASE_JWKS_URI and SUPABASE_ISSUER point at a real project to
    # exercise the token path.
    fixed-user: ${FIXED_USER:true}

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    properties:
      hibernate.jdbc.batch_size: 100

# One JSON object per line, so the log aggregator gets fields rather than a
# string it has to guess at. The requestId set by RequestCorrelationFilter rides
# along in the MDC (proposal §12, Phase 2).
logging:
  structured:
    format:
      console: ecs

springdoc:
  # The spec stays available for CI to diff; the interactive UI does not ship to
  # production (proposal §5.1).
  swagger-ui:
    enabled: false

primeledger:
  seed-demo-data: false
  security:
    require-rls: true
  dev:
    # Belt and braces: SecurityConfig also throws if this is true under prod.
    fixed-user: false
